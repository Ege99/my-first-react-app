name: React CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo kodunu indir
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Paketleri yükle
        run: npm install

      - name: Build al
        run: npm run build
